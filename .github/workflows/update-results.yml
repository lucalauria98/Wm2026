name: WM-Ergebnisse aktualisieren

on:
  schedule:
    - cron: "*/30 * * * *"   # alle 30 Minuten
  workflow_dispatch: {}        # erlaubt manuelles Starten per Knopf

permissions:
  contents: write              # nötig, damit der Bot data.json zurückschreiben darf

concurrency:
  group: wm-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ergebnisse holen
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python update.py

      - name: Änderungen committen
        run: |
          if [ -n "$(git status --porcelain data.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Ergebnisse aktualisiert ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
            echo "data.json aktualisiert und gepusht."
          else
            echo "Keine Änderung – nichts zu committen."
          fi
